name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag'
        required: true
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      release_url:
        description: 'Release URL (ZIP)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          curl -L -o project.zip "${{ inputs.release_url }}"

      - name: Extract ZIP
        run: |
          mkdir -p flutter_project
          unzip -q project.zip -d flutter_project
          mv flutter_project/*/* flutter_project/ 2>/dev/null || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'   # Ubah sesuai kebutuhan
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./flutter_project
        run: |
          flutter pub get

      - name: Build APK (${{ inputs.build_type }})
        working-directory: ./flutter_project
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            flutter_project/build/app/outputs/flutter-apk/app-release.apk
            flutter_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
