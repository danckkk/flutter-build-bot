name: Build Flutter APK - Panel

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (com.example.app)'
        required: true
        default: 'com.example.app'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code'
        required: true
        default: '1'
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      bot_token:
        description: 'Telegram Bot Token'
        required: true
      branch:
        description: 'Branch'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Notify Build Started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
            -d chat_id="${{ inputs.chat_id }}" \
            -d parse_mode="HTML" \
            -d text="⏳ <b>Build Dimulai!</b>%0A%0A🏷️ App: <code>${{ inputs.app_name }}</code>%0A📦 Package: <code>${{ inputs.package_name }}</code>%0A🔢 Versi: <code>${{ inputs.version_name }}</code> (${{ inputs.version_code }})%0A🔨 Tipe: <code>${{ inputs.build_type }}</code>"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch App Information
        run: |
          # Patch AndroidManifest
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ inputs.app_name }}\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|package=\"[^\"]*\"|package=\"${{ inputs.package_name }}\"|g" android/app/src/main/AndroidManifest.xml
          
          # Patch build.gradle
          sed -i "s|applicationId \"[^\"]*\"|applicationId \"${{ inputs.package_name }}\"|g" android/app/build.gradle
          sed -i "s|versionCode [0-9]*|versionCode ${{ inputs.version_code }}|g" android/app/build.gradle
          sed -i "s|versionName \"[^\"]*\"|versionName \"${{ inputs.version_name }}\"|g" android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Prepare APK
        run: |
          mkdir -p output
          if [ "${{ inputs.build_type }}" = "release" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/${{ inputs.app_name }}_v${{ inputs.version_name }}_release.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk output/${{ inputs.app_name }}_v${{ inputs.version_name }}_debug.apk
          fi

      - name: Upload APK to Telegram
        run: |
          APK=$(find output -name "*.apk" | head -1)
          SIZE=$(du -sh "$APK" | cut -f1)
          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
            -F chat_id="${{ inputs.chat_id }}" \
            -F document=@"$APK" \
            -F parse_mode="HTML" \
            -F caption="✅ <b>Build Berhasil!</b>%0A%0A🏷️ App: ${{ inputs.app_name }}%0A📦 Package: <code>${{ inputs.package_name }}</code>%0A🔢 Versi: <code>${{ inputs.version_name }}</code>%0A🔨 Tipe: <code>${{ inputs.build_type }}</code>%0A📁 Size: <code>$SIZE</code>%0A%0A⚡ Build by Bot"

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
            -d chat_id="${{ inputs.chat_id }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Build Gagal!</b>%0A%0A🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
