name: Build Native APK - Panel

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'SyncXxX'
      package_name:
        description: 'Package Name (com.xxx.xxx)'
        required: true
        default: 'com.example.app'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code (angka)'
        required: true
        default: '1'
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      branch:
        description: 'Branch (opsional)'
        required: false
        default: 'main'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      bot_token:
        description: 'Telegram Bot Token'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Notify Build Started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
            -d chat_id="${{ inputs.chat_id }}" \
            -d parse_mode="HTML" \
            -d text="⏳ <b>Build dimulai!</b>%0A%0A🏷️ App: <code>${{ inputs.app_name }}</code>%0A📦 Package: <code>${{ inputs.package_name }}</code>%0A🔢 Versi: <code>${{ inputs.version_name }}</code>+<code>${{ inputs.version_code }}</code>%0A🔨 Tipe: <code>${{ inputs.build_type }}</code>%0A🌿 Branch: <code>${{ inputs.branch }}</code>"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'   # Sesuaikan dengan versi Flutter project kamu

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons (jika ada script)
        run: |
          if [ -f "generate_icons.py" ]; then
            python3 generate_icons.py
          fi

      - name: Patch Android Files
        run: |
          # Patch AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ inputs.app_name }}\"|g" "$MANIFEST"
            # Patch package name
            sed -i "s|package=\"[^\"]*\"|package=\"${{ inputs.package_name }}\"|g" "$MANIFEST"
          fi

          # Patch build.gradle
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i "s|applicationId \"[^\"]*\"|applicationId \"${{ inputs.package_name }}\"|" "$GRADLE"
            sed -i "s|versionCode [0-9]*|versionCode ${{ inputs.version_code }}|" "$GRADLE"
            sed -i "s|versionName \"[^\"]*\"|versionName \"${{ inputs.version_name }}\"|" "$GRADLE"
          fi

          # Patch strings.xml
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${{ inputs.app_name }}</string>|g" "$STRINGS"
          fi

      - name: Build APK
        run: |
          cd android
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Rename & Prepare APK
        run: |
          mkdir -p output
          if [ "${{ inputs.build_type }}" = "release" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "output/${{ inputs.app_name }}_v${{ inputs.version_name }}_${{ inputs.build_type }}.apk"
          else
            echo "❌ APK tidak ditemukan!" && exit 1
          fi

      - name: Send APK to Telegram
        run: |
          APK="output/${{ inputs.app_name }}_v${{ inputs.version_name }}_${{ inputs.build_type }}.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          
          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
            -F chat_id="${{ inputs.chat_id }}" \
            -F document=@"$APK" \
            -F parse_mode="HTML" \
            -F caption="✅ <b>Build Selesai!</b>%0A%0A🏷️ <b>App:</b> ${{ inputs.app_name }}%0A📦 <b>Package:</b> <code>${{ inputs.package_name }}</code>%0A🔢 <b>Versi:</b> <code>${{ inputs.version_name }}</code> (code: ${{ inputs.version_code }})%0A🔨 <b>Tipe:</b> <code>${{ inputs.build_type }}</code>%0A🌿 <b>Branch:</b> <code>${{ inputs.branch }}</code>%0A📁 <b>Size:</b> <code>$SIZE</code>%0A%0A⚡ by @Zyvarno1"

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
            -d chat_id="${{ inputs.chat_id }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Build Gagal!</b>%0A%0A🏷️ App: <code>${{ inputs.app_name }}</code>%0A📦 Package: <code>${{ inputs.package_name }}</code>%0A%0A🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
