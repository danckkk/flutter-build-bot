name: Web to APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'URL Icon (opsional)'
        required: false
        default: 'https://via.placeholder.com/512.png'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Web to APK Project
        run: |
          flutter create --platforms web temp_webapp
          cd temp_webapp

      - name: Build APK from Web URL
        working-directory: ./temp_webapp
        run: |
          echo '{
            "name": "${{ inputs.app_name }}",
            "short_name": "${{ inputs.app_name }}",
            "start_url": "${{ inputs.web_url }}",
            "display": "standalone"
          }' > web/manifest.json

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-result
          path: temp_webapp/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
