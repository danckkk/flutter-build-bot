name: Web to APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      icon_url:
        description: 'Icon URL (optional)'
        required: false

jobs:
  web2apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Web2APK Tool
        run: |
          flutter pub global activate web_to_apk

      - name: Generate APK from Web
        run: |
          web_to_apk \
            --url "${{ inputs.web_url }}" \
            --name "${{ inputs.app_name }}" \
            --icon "${{ inputs.icon_url || 'https://via.placeholder.com/512' }}" \
            --output app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-result
          path: app.apk
          retention-days: 7
