name: Web to APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'URL Icon (PNG)'
        required: false
        default: 'https://via.placeholder.com/512/4A90E2/FFFFFF.png?text=APP'

jobs:
  web2apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create WebView Project
        run: |
          flutter create --platforms android webview_app
          cd webview_app

      - name: Configure WebView
        working-directory: ./webview_app
        run: |
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '${{ inputs.app_name }}',
                debugShowCheckedModeBanner: false,
                home: WebViewScreen(url: '${{ inputs.web_url }}'),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            final String url;
            const WebViewScreen({super.key, required this.url});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse(widget.url));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('${{ inputs.app_name }}')),
                body: WebViewWidget(controller: controller),
              );
            }
          }
          EOF

      - name: Build Release APK
        working-directory: ./webview_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-result
          path: webview_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Show Result
        run: echo "✅ Build Web2APK selesai. APK siap di-download di Artifacts."
